[package]
name = "hyperveil"
version = "0.1.0"
edition = "2024_07"

# Standalone, like the Veil bridge: HyperVeil's contracts restate the pool's
# interface names instead of linking against the `veil` package. The pool is a
# DEV dependency only, so the tests run against the real VeilERC3643.
[lib]

[dependencies]
starknet = "2.17.0"
openzeppelin_token = "2.0.0"
openzeppelin_access = "2.0.0"
openzeppelin_introspection = "2.0.0"

[cairo]
sierra-replace-ids = false
inlining-strategy = 2

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.17.0"
openzeppelin_presets = "2.0.0"
veil = { path = "../.." }

[[target.starknet-contract]]
casm = true
casm-add-pythonic-hints = true
build-external-contracts = [
    "veil::VeilERC3643::VeilERC3643",
    "openzeppelin_presets::account::AccountUpgradeable",
]
